<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Spinning Time</title>
</head>
<body>
    <h1>
        Its time to spin
    </h1>
    <p>
        I like spinning
    </p>
    <div onmouseover="mOver(this)" onmouseout="mOut(this)" style="background-color: lightgreen; width:120px;height:20px;padding:40px;">
        Wanna Spin?
    
    </div> <!-- End of mouse over div , sourcing from W3schools -->
    <div id="click" style="background-color: lightblue; width:120px;height:20px;padding:40px;">
        <button>Click Me</button>
    </div>
    <div id="dblclick" style="background-color: lightcoral; width:120px;height:20px;padding:40px;">
        <button>Double Click Me</button>
    </div>
    <script src="scripts.js" defer></script>

</body>
</html>
